[bar.default]
border = "shadow"
capsule = true
capsule_opacity = 0.84999998100101948
capsule_padding = 8.0
capsule_thickness = 0.79999998584389687
center = [ "group:g1" ]
concave_edge_corners = false
end = [ "tray", "keyboard_layout", "network", "volume", "wallpaper", "settings", "session", "audio_visualizer" ]
margin_ends = 0
radius = 0
start = [ "workspaces" ]
thickness = 32

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "notifications", "clock" ]
    opacity = 0.84999996423721313
    padding = 8.0

[calendar]

[control_center]
hidden_tabs = [ "monitor", "weather" ]

    [control_center.calendar]
    show_events_card = false

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "power_profile"

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
radius = 19

[lockscreen]
fingerprint = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@Virtual-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 834.29998779296875
    output = "Virtual-1"
    placement_height = 1080.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[[plugins.source]]
enabled = false
kind = "git"
location = "https://github.com/noctalia-dev/official-plugins"
name = "official"

[[plugins.source]]
enabled = false
kind = "git"
location = "https://github.com/noctalia-dev/community-plugins"
name = "community"

[shell]
clipboard_enabled = false
clipboard_keep_from_closed_apps = false
font_family = "JetBrainsMono Nerd Font Mono"
lang = "en"
panel_anchor_bar = "default"
polkit_agent = true
show_location = false

    [shell.animation]
    speed = 1.4000000208616257

    [shell.panel]
    wallpaper_placement = "floating"

    [shell.screen_corners]
    size = 1

[system.monitor]
enabled = false

[theme]
builtin = "Dracula"
community_palette = "Inabakumori"
mode = "dark"
wallpaper_scheme = "vibrant"

    [theme.templates]
    builtin_ids = [ "alacritty", "gtk3", "gtk4", "niri", "qt" ]
    community_ids = [ "zed" ]

[wallpaper]
directory = "/home/user/Images"
fill_mode = "stretch"

    [wallpaper.default]
    path = "color:#353535"

    [wallpaper.last]
    path = "color:#353535"

    [wallpaper.monitors.Virtual-1]
    path = "color:#353535"

    [[wallpaper.favorite]]
    path = "/home/user/Images/799624.jpg"
    theme_mode = "auto"

[weather]
effects = false
enabled = false

[widget.control-center]
glyph = "home"

[widget.network]
show_vpn_label = true
vpn_status = "both"
